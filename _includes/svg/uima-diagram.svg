<svg class="uima-diagram" viewBox="0 0 480 306" role="img" aria-labelledby="uima-diagram-title uima-diagram-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="uima-diagram-title">How UIMA processes a document</title>
  <desc id="uima-diagram-desc">A collection reader passes documents into an aggregate analysis engine made of a sentence detector, a tokenizer and an entity recognizer, and a writer saves the result as XMI or JSON. Below, the CAS for the sentence "Ada Lovelace met Charles Babbage in London." holds the document text and the annotations the engines added: one Sentence, a Token for each word, Person annotations on Ada Lovelace and Charles Babbage, and a Location annotation on London.</desc>
  <defs><marker id="uima-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" class="arrowhead"/></marker></defs>
  <g class="pipeline">
    <text class="caption" x="108" y="20">Aggregate analysis engine</text>
    <rect class="frame" x="108" y="28" width="264" height="64" rx="10"/>
    <rect class="node io" x="8" y="44" width="80" height="32" rx="16"/>
    <text class="label" x="48" y="64" text-anchor="middle">Reader</text>
    <text class="caption" x="48" y="94" text-anchor="middle">documents</text>
    <rect class="node io" x="392" y="44" width="80" height="32" rx="16"/>
    <text class="label" x="432" y="64" text-anchor="middle">Writer</text>
    <text class="caption" x="432" y="94" text-anchor="middle">XMI, JSON</text>
    <rect class="node" x="120" y="40" width="72" height="40" rx="6"/>
    <text class="label" x="156" y="58" text-anchor="middle">Sentences</text>
    <rect class="ann sent" x="149" y="66" width="14" height="6" rx="2"/>
    <rect class="node" x="204" y="40" width="72" height="40" rx="6"/>
    <text class="label" x="240" y="58" text-anchor="middle">Tokenizer</text>
    <rect class="ann tok" x="233" y="66" width="14" height="6" rx="2"/>
    <rect class="node" x="288" y="40" width="72" height="40" rx="6"/>
    <text class="label" x="324" y="58" text-anchor="middle">Entities</text>
    <rect class="ann per" x="308" y="66" width="14" height="6" rx="2"/>
    <rect class="ann loc" x="326" y="66" width="14" height="6" rx="2"/>
    <line class="flow" x1="88" y1="60" x2="118" y2="60" marker-end="url(#uima-arrow)"/>
    <line class="flow" x1="192" y1="60" x2="202" y2="60" marker-end="url(#uima-arrow)"/>
    <line class="flow" x1="276" y1="60" x2="286" y2="60" marker-end="url(#uima-arrow)"/>
    <line class="flow" x1="360" y1="60" x2="390" y2="60" marker-end="url(#uima-arrow)"/>
  </g>
  <g class="cas">
    <rect class="panel" x="8" y="124" width="464" height="174" rx="10"/>
    <text class="title" x="24" y="150">CAS</text>
    <text class="caption" x="70" y="150">the document and everything known about it, typed by the type system</text>
    <text class="doc" x="104.0" y="186" textLength="22.8" lengthAdjust="spacingAndGlyphs">Ada</text>
    <text class="doc" x="134.4" y="186" textLength="60.8" lengthAdjust="spacingAndGlyphs">Lovelace</text>
    <text class="doc" x="202.8" y="186" textLength="22.8" lengthAdjust="spacingAndGlyphs">met</text>
    <text class="doc" x="233.2" y="186" textLength="53.2" lengthAdjust="spacingAndGlyphs">Charles</text>
    <text class="doc" x="294.0" y="186" textLength="53.2" lengthAdjust="spacingAndGlyphs">Babbage</text>
    <text class="doc" x="354.8" y="186" textLength="15.2" lengthAdjust="spacingAndGlyphs">in</text>
    <text class="doc" x="377.6" y="186" textLength="45.6" lengthAdjust="spacingAndGlyphs">London</text>
    <text class="doc" x="423.2" y="186" textLength="7.6" lengthAdjust="spacingAndGlyphs">.</text>
    <text class="layer" x="92" y="186" text-anchor="end">text</text>
    <text class="layer" x="92" y="213" text-anchor="end">Sentence</text>
    <rect class="ann sent" x="104.5" y="204" width="325.8" height="11" rx="3"/>
    <text class="layer" x="92" y="237" text-anchor="end">Token</text>
    <rect class="ann tok" x="104.5" y="228" width="21.8" height="11" rx="3"/>
    <rect class="ann tok" x="134.9" y="228" width="59.8" height="11" rx="3"/>
    <rect class="ann tok" x="203.3" y="228" width="21.8" height="11" rx="3"/>
    <rect class="ann tok" x="233.7" y="228" width="52.2" height="11" rx="3"/>
    <rect class="ann tok" x="294.5" y="228" width="52.2" height="11" rx="3"/>
    <rect class="ann tok" x="355.3" y="228" width="14.2" height="11" rx="3"/>
    <rect class="ann tok" x="378.1" y="228" width="44.6" height="11" rx="3"/>
    <rect class="ann tok" x="423.7" y="228" width="6.6" height="11" rx="3"/>
    <text class="layer" x="92" y="261" text-anchor="end">Person</text>
    <rect class="ann per" x="104.5" y="252" width="90.2" height="11" rx="3"/>
    <rect class="ann per" x="233.7" y="252" width="113.0" height="11" rx="3"/>
    <text class="layer" x="92" y="285" text-anchor="end">Location</text>
    <rect class="ann loc" x="378.1" y="276" width="44.6" height="11" rx="3"/>
  </g>
</svg>
