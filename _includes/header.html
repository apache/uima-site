<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="/" aria-label="Apache UIMA home">
      {% include svg/uima-logo-mono.svg %}
      <span><small>Apache</small> UIMA<sup>™</sup></span>
    </a>
    <button class="nav-toggle" aria-controls="site-nav" aria-expanded="false">Menu</button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      {% for item in site.data.navigation.main %}
        <a href="{{ item.url }}"{% if page.active == item.id %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
      <form class="search" action="/search.html" role="search">
        <label class="visually-hidden" for="q">Search</label>
        <input id="q" name="q" type="search" placeholder="Search docs and site">
      </form>
      <div class="theme-switch" role="group" aria-label="Colour theme" hidden>
        <button type="button" data-theme-choice="light" title="Light" aria-label="Light theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button type="button" data-theme-choice="auto" title="Auto (follow system)" aria-label="Automatic theme, follows the system">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
        </button>
        <button type="button" data-theme-choice="dark" title="Dark" aria-label="Dark theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
        </button>
      </div>
      <a class="github-link" href="https://github.com/search?q=org%3Aapache+uima+in%3Aname+archived%3Afalse&amp;type=repositories" title="Apache UIMA repositories on GitHub" aria-label="Apache UIMA repositories on GitHub">
        {% include svg/github-mark.svg %}
        <span class="label">Repositories on GitHub</span>
      </a>
      <a class="asf-link" href="https://www.apache.org/" title="The Apache Software Foundation">{% include svg/asf-leaf.svg %}<span>ASF</span></a>
    </nav>
  </div>
</header>
